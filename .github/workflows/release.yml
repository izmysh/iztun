name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source and pinned upstream dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: upstream/amneziawg-go/go.sum

      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev python3 python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb xauth

      - name: Test and build release files
        run: |
          make test
          timeout 120 xvfb-run -a python3 scripts/verify-gui.py --source src/amneziawg-linux-gui
          make deb
          make audit
          make source-bundle

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.deb
            dist/*-source.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
