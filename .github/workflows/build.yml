name: Build ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source and pinned upstream dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: upstream/amneziawg-go/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev python3 python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb xauth

      - name: Run tests
        run: |
          make test
          timeout 120 xvfb-run -a python3 scripts/verify-gui.py --source src/amneziawg-linux-gui

      - name: Build Debian package
        run: make deb

      - name: Scan shipped engine
        run: make audit

      - name: Build corresponding source archive
        run: make source-bundle

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amneziawg-linux-gui-arm64
          path: |
            dist/*.deb
            dist/*.sha256
            dist/*-source.tar.gz
          if-no-files-found: error
